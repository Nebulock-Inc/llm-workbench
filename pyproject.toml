[project]
name = "llm-lab"
version = "0.1.0"
description = "Framework for testing the best LLM for your task"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.86",
    "click>=8.5.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_lab"
module-root = "src"

[project.scripts]
llm-lab = "llm_lab.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
openai = [
    "openai>=3.7.0",
]
anthropic = [
    "anthropic>=1.3.0",
]
analysis = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scipy>=1.11",
    "statsmodels>=0.14",
]
clickhouse = [
    "clickhouse-connect>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
