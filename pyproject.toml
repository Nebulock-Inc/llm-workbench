[project]
name = "llm-workbench"
version = "0.1.1"
description = "Framework for testing the best LLM for your task"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Stephanie Kirmer" }]
keywords = [
    "llm",
    "evaluation",
    "evals",
    "llm-as-a-judge",
    "benchmarking",
    "model-comparison",
    "power-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "boto3>=1.43.86",
    "click>=8.5.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_workbench"
module-root = "src"

[project.urls]
Homepage = "https://github.com/Nebulock-Inc/llm-workbench"
Repository = "https://github.com/Nebulock-Inc/llm-workbench"
Issues = "https://github.com/Nebulock-Inc/llm-workbench/issues"

[project.scripts]
llm-workbench = "llm_workbench.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=4",
]
openai = [
    "openai>=3.7.0",
]
anthropic = [
    "anthropic>=1.3.0",
]
analysis = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Lean gate: pyflakes (real bugs), pycodestyle errors, and import sorting.
# E501 (line length) is left to `ruff format`, not enforced as a lint error.
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=0.26",
]
