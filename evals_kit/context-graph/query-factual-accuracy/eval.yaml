# Ported from evals-as-code/evals/query-factual-accuracy for llm_lab.
# Trace-query metadata stripped (llm_lab EvalSpec forbids those keys).
# Variables ({input}, {queries}, {query_results}, {output}) come from the
# record + task aux + task output.
name: Query Factual Accuracy
description: >-
  Judges whether the response is factually accurate, with no invented information
  and correct numerical details (counts, dates, severity levels) from query results.
direction: MAXIMIZE
labels:
  "All facts supported by query results; counts, dates, and attributes are accurate": 5
  "Factually accurate with one minor numerical discrepancy (e.g., rounds 3.2 to 3)": 4
  "One invented claim OR one significant numerical error (e.g., says 5 when query returned 4)": 3
  "Multiple invented facts or multiple numerical inaccuracies": 2
  "Response is mostly fabricated with minimal grounding in query results": 1
prompt_file: prompt.md
