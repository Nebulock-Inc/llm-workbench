# Ported from evals-as-code/evals/query-answers-question for llm_lab.
# Trace-query metadata (granularity/integration/model/subqueries/expression/mappings)
# stripped: llm_lab's EvalSpec forbids those keys. Variables ({input}, {query_results},
# {output}) come from the record + task aux + task output.
name: Query Answers Question
description: >-
  Judges whether the agent answers a relevant question effectively, without inserting irrelevant data or omitting important components.
direction: MAXIMIZE
labels:
  "Directly answers the question OR appropriately refuses with redirection; relevant, complete, actionable": 5
  "Answers the question with minor tangents or unnecessary detail": 4
  "Answers the core question but misses some nuance or is partially incomplete": 3
  "Provides related information but does not clearly address the specific question": 2
  "Does not answer the question AND does not appropriately refuse": 1
include_explanations: true
prompt_file: prompt.md
