name: Release

# Builds distribution artifacts and attaches them to the GitHub Release.
# Triggered when you publish a Release in the GitHub UI (which creates the tag).
# PyPI publishing is intentionally NOT handled here — keep that in its own workflow.
on:
  release:
    types: [published]

permissions:
  contents: write # needed to upload assets to the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Guard against the tag and the packaged version drifting apart.
      - name: Check tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version --short)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME -> $tag) does not match pyproject version ($pkg)"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --extra analysis --extra dev

      - name: Pytest
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
