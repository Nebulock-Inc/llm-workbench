name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please search existing issues first to avoid duplicates.

        **Do not report security vulnerabilities here** — see
        [SECURITY.md](https://github.com/Nebulock-Inc/llm-workbench/blob/main/SECURITY.md).
  - type: textarea
    id: what-ran
    attributes:
      label: What you ran
      description: The exact `llm-workbench` command (or code), including the prompt template / task and eval involved.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: What you expected vs. what happened
      description: The actual result or error, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full error output
      description: The complete traceback or message, not just the last line.
      render: shell
    validations:
      required: false
  - type: input
    id: models
    attributes:
      label: Model(s) involved
      description: The provider/model id(s), e.g. ollama/llama3.1, anthropic/claude-sonnet-4-5.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: llm-workbench version
      description: Output of `llm-workbench --version`.
    validations:
      required: true
  - type: input
    id: python-os
    attributes:
      label: Python version and OS
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest dataset, eval, and command that still shows the problem, if you can narrow it down.
    validations:
      required: false
