name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem or use case, not just a proposed solution — what you're trying to do and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: Anything you're doing now to work around the limitation.
    validations:
      required: false
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have an idea for how this could work, describe it here (optional).
    validations:
      required: false
